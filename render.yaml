# ============================================================
#  Render Blueprint — Ein-Klick-Deployment
#  https://render.com/docs/blueprint-spec
# ============================================================
services:
  - type: web
    name: my-style
    runtime: python
    # TESTWEG: kostenlos. Render haengt Plattenlaeufe ausschliesslich an
    # bezahlte Instanzen — auf "free" ist die SQLite-Datei nach jedem
    # Neustart weg. Fuer den Dauerbetrieb spaeter zwei Aenderungen:
    #   1) plan: starter
    #   2) den Block "disk:" unten aktivieren
    plan: free
    region: frankfurt   # eu-central, nah bei dir
    branch: main
    # stamp_sw.py setzt die Cache-Version des Service Workers auf den
    # Commit. Ohne das liefert der Service Worker nach einem Deploy
    # weiter die alten JavaScript-Dateien aus.
    buildCommand: python stamp_sw.py && pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 --access-logfile - --error-logfile -
    healthCheckPath: /healthz

    # WICHTIG: Ohne diese Variablen startet die App, aber ohne
    # KI-Funktionen (Frisuren, Outfits, Produktbeschreibung) und
    # ohne Produkt-/Videosuche. Werte werden im Render-Dashboard
    # unter "Environment" eingetragen — NICHT in diese Datei.
    envVars:
      - key: SECRET_KEY
        generateValue: true          # Render erzeugt einen sicheren Zufallswert
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: AESTRA_DEBUG
        value: "0"
      - key: AESTRA_HOST
        value: "0.0.0.0"
      - key: FORCE_SECURE_COOKIES
        value: "1"
      # Ohne Plattenlauf (free) ist dieser Pfad nur ein Wunsch: die App
      # legt ihn an, kann dort aber nichts dauerhaft halten.
      - key: DATABASE_PATH
        value: /data/styleai.db
      # Beide Schluessel NICHT hier eintragen — Render wuerde sie dann
      # im Klartext im YAML speichern. Stattdessen die Zeilen aktivieren
      # und die Werte im Dashboard eintragen (sync: false = Secret).
      - key: GEMINI_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false

    # >>> FUER DEN DAUERBETRIEB AKTIVIEREN (nur mit plan: starter) <<<
    # disk:
