<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Beauty Analysis</title>
    <style>
        :root {
            --accent: #5ef2c3;
            --bg: #0d0d0d;
            --card-bg: #181818;
            --border: rgba(255, 255, 255, 0.12);
        }
        body { background-color: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; padding: 20px; box-sizing: border-box; }
        
        h1 { text-align: center; text-transform: uppercase; }
        h1 span { color: var(--accent); font-weight: 800; }

        /* Analysis Grid placed below Title */
        .analysis-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
        .info-card { background: var(--card-bg); padding: 15px; border-radius: 12px; border-left: 3px solid var(--accent); }
        .info-card span { color: #666; font-size: 10px; text-transform: uppercase; display: block; }
        .info-card p { margin: 5px 0 0; font-weight: bold; font-size: 14px; }

        /* Tabs Navigation */
        .tab-nav { display: flex; background: rgba(255,255,255,0.05); padding: 5px; border-radius: 50px; margin-bottom: 20px; }
        .tab-nav button { flex: 1; padding: 12px; border: none; background: transparent; color: white; border-radius: 50px; cursor: pointer; font-weight: 600; }
        .tab-nav button.active { background: var(--accent); color: #000; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Product Cards */
        .product-card { background: var(--card-bg); padding: 20px; border-radius: 20px; border: 1px solid var(--border); margin-bottom: 15px; }
        .product-header { display: flex; align-items: center; margin-bottom: 5px; }
        
        /* The dot style without the broken inline background */
        .product-dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 15px; }
        .product-label { margin: 0; font-size: 15px; font-weight: 500; }
    </style>
</head>
<body>
<div class="container">
    <h1>AI <span>SCAN</span></h1>

    <div class="analysis-grid">
        {% for key, value in result.items() if key != 'confidence_score' %}
        <div class="info-card">
            <span>{{ key.replace('_', ' ') }}</span>
            <p>{{ value }}</p>
        </div>
        {% endfor %}
    </div>

    <div class="tab-nav">
        <button id="btn-tut" onclick="showTab('tut')">Tutorial</button>
        <button id="btn-map" class="active" onclick="showTab('map')">Face Map</button>
        <button id="btn-prod" onclick="showTab('prod')">Products</button>
    </div>

    <div id="tab-tut" class="tab-content">
        <div class="product-card" style="white-space: pre-line;">{{ report | safe }}</div>
    </div>

    <div id="tab-map" class="tab-content active">
        <img src="data:image/jpeg;base64,{{ map_image }}" style="width: 100%; border-radius: 15px;">
    </div>

    <div id="tab-prod" class="tab-content">
        {% for instr in map_data %}
        <div class="product-card">
            <div class="product-header">
                <div class="product-dot js-dot" data-color="{{ instr.color }}"></div>
                <p class="product-label">{{ instr.label | safe }}</p>
            </div>
            <small style="color: #666; margin-left: 27px;">Apply to: {{ instr.zone }}</small>
        </div>
        {% endfor %}
    </div>

    <button style="width:100%; padding:16px; background:none; border:1px solid var(--border); color:white; border-radius:18px; margin-top:20px; cursor:pointer;" onclick="location.href='/'">NEW ANALYSIS</button>
</div>

<script>
    function showTab(tabName) {
        // Hide all tabs
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        // Deactivate all buttons
        document.querySelectorAll('.tab-nav button').forEach(btn => btn.classList.remove('active'));
        
        // Show target tab
        document.getElementById('tab-' + tabName).classList.add('active');
        document.getElementById('btn-' + tabName).classList.add('active');
        
        // Re-apply colors when products tab is opened
        if(tabName === 'prod') applyColors();
    }

    function applyColors() {
        document.querySelectorAll('.js-dot').forEach(dot => {
            const color = dot.getAttribute('data-color');
            if (color) {
                dot.style.backgroundColor = color;
                dot.style.boxShadow = `0 0 10px ${color}`;
            }
        });
    }

    // Initialize colors on load
    window.onload = applyColors;
</script>
</body>
</html>
